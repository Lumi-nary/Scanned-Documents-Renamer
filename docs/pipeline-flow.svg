<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1128" width="800" height="1128" role="img" aria-label="Scanned Documents Renamer pipeline flow map">
  <defs>
    <marker id="head-emerald" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#34d399"/></marker>
    <marker id="head-amber" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#fbbf24"/></marker>
    <marker id="head-violet" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#a78bfa"/></marker>
    <marker id="head-cyan" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#22d3ee"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <style>
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    </style>
  </defs>
  <rect width="800" height="1128" fill="#020617"/>
  <rect width="800" height="1128" fill="url(#grid)"/>
  <circle cx="66" cy="47" r="5" fill="#34d399" class="pulse"/>
  <text x="84" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9" letter-spacing="0.4">SCANNED DOCUMENTS RENAMER</text>
  <text x="84" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Automatic Scan Ingestion → Smart AI Reading → Organized Client Filing</text>
  <rect x="40" y="96" width="720" height="726" rx="12" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="8,4" opacity="0.75"/>
  <text x="56" y="117" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#818cf8" letter-spacing="0.6">AUTOMATED 4-STEP FILING PIPELINE (ZERO TECHNICAL EFFORT REQUIRED)</text>
  
  <!-- Step 1: Scanner -->
  <rect x="80" y="140" width="300" height="88" rx="8" fill="#0f172a"/>
  <rect x="80" y="140" width="300" height="88" rx="8" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="230.0" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">1. Physical Scanner</text>
  <text x="230.0" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#94a3b8">You feed paper pages into your scanner</text>
  <text x="230.0" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b">Scanner generates a multi-page PDF</text>
  <circle cx="99" cy="159" r="11" fill="#0f172a" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="99" y="163" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">1</text>

  <!-- Step 2: Incoming Folder -->
  <rect x="80" y="252" width="300" height="88" rx="8" fill="#0f172a"/>
  <rect x="80" y="252" width="300" height="88" rx="8" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="230.0" y="282" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">2. Incoming Folder</text>
  <text x="230.0" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Scanner drops PDF into watch folder</text>
  <text x="230.0" y="316" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b">e.g., Scan_20260922_0001.pdf</text>
  <circle cx="99" cy="271" r="11" fill="#0f172a" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="99" y="275" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">2</text>

  <!-- Step 3: Scan Detection -->
  <rect x="80" y="364" width="300" height="88" rx="8" fill="#0f172a"/>
  <rect x="80" y="364" width="300" height="88" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="230.0" y="394" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">3. Automatic File Detection</text>
  <text x="230.0" y="412" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#94a3b8">App instantly detects the new file</text>
  <text x="230.0" y="427" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6ee7b7">No need to click refresh or upload</text>
  <circle cx="99" cy="383" r="11" fill="#0f172a" stroke="#34d399" stroke-width="1.3"/>
  <text x="99" y="387" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#34d399">3</text>

  <!-- Step 4: Completion Verification -->
  <rect x="80" y="476" width="300" height="88" rx="8" fill="#0f172a"/>
  <rect x="80" y="476" width="300" height="88" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="230.0" y="506" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">4. Safe Finish Verification</text>
  <text x="230.0" y="524" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Waits until scanner finishes saving</text>
  <text x="230.0" y="539" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6ee7b7">Never interrupts multi-page jobs</text>
  <circle cx="99" cy="495" r="11" fill="#0f172a" stroke="#34d399" stroke-width="1.3"/>
  <text x="99" y="499" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#34d399">4</text>

  <!-- Step 5: Document Queue -->
  <rect x="80" y="588" width="300" height="88" rx="8" fill="#0f172a"/>
  <rect x="80" y="588" width="300" height="88" rx="8" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="230.0" y="618" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">5. Processing Queue</text>
  <text x="230.0" y="636" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Queues scans in clean sequence</text>
  <text x="230.0" y="651" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#fdba74">Handles rapid batches smoothly</text>
  <circle cx="99" cy="607" r="11" fill="#0f172a" stroke="#fb923c" stroke-width="1.3"/>
  <text x="99" y="611" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#fb923c">5</text>

  <!-- Step 6: Text & Visual Reading -->
  <rect x="80" y="700" width="300" height="88" rx="8" fill="#0f172a"/>
  <rect x="80" y="700" width="300" height="88" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="230.0" y="730" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">6. Reading Document Text</text>
  <text x="230.0" y="748" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Reads text, headers, and dates</text>
  <text x="230.0" y="763" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6ee7b7">Supports PDF scans and Word documents</text>
  <circle cx="99" cy="719" r="11" fill="#0f172a" stroke="#34d399" stroke-width="1.3"/>
  <text x="99" y="723" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#34d399">6</text>

  <!-- Step 7: Classification Engine -->
  <rect x="420" y="700" width="300" height="88" rx="8" fill="#0f172a"/>
  <rect x="420" y="700" width="300" height="88" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="570.0" y="730" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">7. Intelligent Classification</text>
  <text x="570.0" y="748" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Runs via 100% Offline OCR or AI</text>
  <text x="570.0" y="763" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6ee7b7">OpenRouter, DeepSeek, OpenAI, or Local</text>
  <circle cx="439" cy="719" r="11" fill="#0f172a" stroke="#34d399" stroke-width="1.3"/>
  <text x="439" y="723" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#34d399">7</text>

  <!-- Step 8: Document Understanding -->
  <rect x="420" y="588" width="300" height="88" rx="8" fill="#0f172a"/>
  <rect x="420" y="588" width="300" height="88" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="570.0" y="618" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">8. Document Understanding</text>
  <text x="570.0" y="636" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Finds Document Type &amp; Date</text>
  <text x="570.0" y="651" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#fde68a">Detects Corporate Secretary / Officer</text>
  <circle cx="439" cy="607" r="11" fill="#0f172a" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="439" y="611" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">8</text>

  <!-- Step 9: Structured Details -->
  <rect x="420" y="476" width="300" height="88" rx="8" fill="#0f172a"/>
  <rect x="420" y="476" width="300" height="88" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="570.0" y="506" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">9. Extracted Information</text>
  <text x="570.0" y="524" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Title, Client Name, and Date</text>
  <text x="570.0" y="539" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#fde68a">e.g. Acme Corp · Doc. No. 387 · 09/12/2025</text>
  <circle cx="439" cy="495" r="11" fill="#0f172a" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="439" y="499" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">9</text>

  <!-- Step 10: Instructions Matching -->
  <rect x="420" y="364" width="300" height="88" rx="8" fill="#0f172a"/>
  <rect x="420" y="364" width="300" height="88" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="570.0" y="394" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">10. Your Custom Rules</text>
  <text x="570.0" y="412" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Applies your preferred naming style</text>
  <text x="570.0" y="427" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#c4b5fd">From the 'Instructions' Tab in the app</text>
  <circle cx="439" cy="383" r="11" fill="#0f172a" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="439" y="387" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#a78bfa">10</text>

  <!-- Step 11: Professional Renaming -->
  <rect x="420" y="252" width="300" height="88" rx="8" fill="#0f172a"/>
  <rect x="420" y="252" width="300" height="88" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="570.0" y="282" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">11. Professional Rename</text>
  <text x="570.0" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Clean, standard, searchable filename</text>
  <text x="570.0" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#c4b5fd">Prevents accidental overwrites (_2, _3)</text>
  <circle cx="439" cy="271" r="11" fill="#0f172a" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="439" y="275" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#a78bfa">11</text>

  <!-- Step 12: Filed into Client Folder -->
  <rect x="420" y="140" width="300" height="88" rx="8" fill="#0f172a"/>
  <rect x="420" y="140" width="300" height="88" rx="8" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="1.8"/>
  <text x="570.0" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399">12. Automatically Filed!</text>
  <text x="570.0" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#e2e8f0">Moved directly into the client's folder</text>
  <text x="570.0" y="203" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a7f3d0">e.g. Clients/Acme Corp/Certificate.pdf</text>
  <circle cx="439" cy="159" r="11" fill="#0f172a" stroke="#34d399" stroke-width="1.3"/>
  <text x="439" y="163" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#34d399">12</text>

  <!-- Flow Arrows -->
  <line x1="230.0" y1="230" x2="230.0" y2="249" stroke="#34d399" stroke-width="1.7" marker-end="url(#head-emerald)"/>
  <line x1="230.0" y1="342" x2="230.0" y2="361" stroke="#34d399" stroke-width="1.7" marker-end="url(#head-emerald)"/>
  <line x1="230.0" y1="454" x2="230.0" y2="473" stroke="#34d399" stroke-width="1.7" marker-end="url(#head-emerald)"/>
  <line x1="230.0" y1="566" x2="230.0" y2="585" stroke="#34d399" stroke-width="1.7" marker-end="url(#head-emerald)"/>
  <line x1="230.0" y1="678" x2="230.0" y2="697" stroke="#34d399" stroke-width="1.7" marker-end="url(#head-emerald)"/>
  <line x1="383" y1="744.0" x2="416" y2="744.0" stroke="#fbbf24" stroke-width="1.7" marker-end="url(#head-amber)"/>
  <line x1="570.0" y1="697" x2="570.0" y2="678" stroke="#a78bfa" stroke-width="1.7" marker-end="url(#head-violet)"/>
  <line x1="570.0" y1="585" x2="570.0" y2="566" stroke="#a78bfa" stroke-width="1.7" marker-end="url(#head-violet)"/>
  <line x1="570.0" y1="473" x2="570.0" y2="454" stroke="#a78bfa" stroke-width="1.7" marker-end="url(#head-violet)"/>
  <line x1="570.0" y1="361" x2="570.0" y2="342" stroke="#a78bfa" stroke-width="1.7" marker-end="url(#head-violet)"/>
  <line x1="570.0" y1="249" x2="570.0" y2="230" stroke="#34d399" stroke-width="1.7" marker-end="url(#head-emerald)"/>

  <!-- Bottom Feature Highlights -->
  <rect x="80" y="838.0" width="300" height="68" rx="8" fill="#0f172a"/>
  <rect x="80" y="838.0" width="300" height="68" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="230.0" y="866.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Folders &amp; Settings + Floating Save</text>
  <text x="230.0" y="884.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">Pick scanner &amp; client folders with one click</text>
  <text x="230.0" y="899.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#22d3ee">Floating save button pops up when you make edits</text>

  <rect x="420" y="838.0" width="300" height="68" rx="8" fill="#0f172a"/>
  <rect x="420" y="838.0" width="300" height="68" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="570.0" y="866.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Instructions Tab (Custom Rules)</text>
  <text x="570.0" y="884.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">Customize rules for SOA, Liquidation, Deeds, etc.</text>
  <text x="570.0" y="899.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#c4b5fd">Add your own document types without coding</text>

  <rect x="80" y="939.0" width="640" height="58" rx="8" fill="#0f172a"/>
  <rect x="80" y="939.0" width="640" height="58" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="400.0" y="966.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Ready for Non-Technical Office Staff</text>
  <text x="400.0" y="984.0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#a7f3d0">Download the Windows .exe, choose your folders, and click "Start Ingestion" — Zero setup required!</text>

  <!-- Footer Legend & Privacy Notice -->
  <line x1="80" y1="1025" x2="720" y2="1025" stroke="#1e293b" stroke-width="1"/>
  <text x="80" y="1055" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#34d399">🔒 100% PRIVATE &amp; SECURE:</text>
  <text x="80" y="1075" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Your files, PDFs, and client names never leave your computer unless you connect a cloud AI.</text>
  <text x="80" y="1095" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Runs completely offline in Native mode with zero API keys and zero recurring subscriptions.</text>
</svg>
